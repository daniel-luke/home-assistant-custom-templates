## Replace device_id with your IR remote
## Replace device with the name of your device, given when you learnt the commands. In my case bedroom_fan
## Replace input_number.bedroom_fan_percentage with your input number helper
## Replace input_boolean.bedroom_fan_state with your input boolean helper

bedroom_fan_on:
  alias: bedroom_fan_on
  sequence:
  - service: remote.send_command
    target:
      device_id: remote.<your-remote>
    data:
      command: low
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.bedroom_fan_state
  - service: input_number.set_value
    target:
      entity_id: input_number.bedroom_fan_percentage
    data:
      value: 33
  mode: single
bedroom_fan_off:
  alias: bedroom_fan_off
  sequence:
  - service: remote.send_command
    target:
      entity_id: remote.<your-remote>
    data:
      num_repeats: 1
      delay_secs: 0.4
      hold_secs: 0.4
      device: bedroom_fan
      command: 'off'
  - service: input_boolean.turn_off
    target:
      entity_id: input_boolean.bedroom_fan_state
  - service: input_number.set_value
    target:
      entity_id: input_number.bedroom_fan_percentage
    data:
      value: 0
  mode: single
bedroom_fan_set_speed:
  alias: bedroom_fan_set_speed
  sequence:
  - service: input_number.set_value
    target:
      entity_id: input_number.bedroom_fan_percentage
    data:
      value: '{{ percentage }}'
  - delay:
      hours: 0
      minutes: 0
      seconds: 0
      milliseconds: 500
  - choose:
    - conditions:
      - condition: state
        entity_id: input_number.bedroom_fan_percentage
        state: '66.0'
      sequence:
      - service: remote.send_command
        target:
          entity_id: remote.<your-remote>
        data:
          num_repeats: 1
          delay_secs: 0.4
          hold_secs: 0.4
          device: bedroom_fan
          command: medium
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.bedroom_fan_state
    - conditions:
      - condition: state
        entity_id: input_number.bedroom_fan_percentage
        state: '100.0'
      sequence:
      - service: remote.send_command
        target:
          entity_id: remote.<your-remote>
        data:
          num_repeats: 1
          delay_secs: 0.4
          hold_secs: 0.4
          device: bedroom_fan
          command: high
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.bedroom_fan_state
    - conditions:
      - condition: state
        entity_id: input_number.bedroom_fan_percentage
        state: '33.0'
      sequence:
      - service: remote.send_command
        target:
          entity_id: remote.<your-remote>
        data:
          num_repeats: 1
          delay_secs: 0.4
          hold_secs: 0.4
          device: bedroom_fan
          command: low
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.bedroom_fan_state
    - conditions:
      - condition: state
        entity_id: input_number.bedroom_fan_percentage
        state: '0.0'
      sequence:
      - service: script.bedroom_fan_off
    default: []
  mode: single
